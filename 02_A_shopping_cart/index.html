<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>agoodshop</title>
</head>

<body>
    <header class="pg-wrapper">
        <nav class="header-nav">
            agoodshop
        </nav>
    </header>
    <div class="divider"></div>
    <main class="pg-wrapper">
        <div class="checkout">
            <div class="checkout__list" id="list">
                <ul class="list__ul" id="listUl">
                    <li class="list__head">
                        <div class="list__item--product"> Producto </div>
                        <div class="list__item--controls">Cantidad</div>
                        <div class="list__item--units">Unidad</div>
                        <div class="list__item--total">Total</div>
                    </li>
                </ul>


            </div>
            <div class="checkout__total" id="total">
                <ul class="list__ul" id="totalUl">
                    <li class="total__head">
                        Total
                    </li>
                </ul>
            </div>

        </div>
    </main>

    <script src="./js/productItemCart.js"></script>
    <script src="./js/shoppingCart.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>
